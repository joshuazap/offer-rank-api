services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: offer
      POSTGRES_PASSWORD: offer
      POSTGRES_DB: offer_rank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer -d offer_rank"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://offer:offer@db:5432/offer_rank
    depends_on:
      db:
        condition: service_healthy
